services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fixed-source-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    volumes:
      - fixed-source-data:/app/data
      - fixed-source-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fixed-source-frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fixed-source-data:
  fixed-source-uploads:
