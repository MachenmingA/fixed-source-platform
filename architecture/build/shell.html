<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='white'%3E%E5%87%80%3C/text%3E%3C/svg%3E">
<title>净源智研 · 系统总体架构 | 当前状态</title>
<style>
  :root{
    --ink:#132420;
    --ink-2:#1d3a32;
    --muted:#5f736c;
    --muted-2:#84958f;
    --line:#d8e3de;
    --line-2:#e7eeea;
    --paper:#eef2ee;
    --card:#ffffff;
    --green:#0f766e;
    --green-deep:#0b3d34;
    --teal:#0e7490;
    --amber:#b45309;
    --rose:#be123c;
    --indigo:#4338ca;
    --slate:#64748b;
    --lime:#84cc16;
    --shadow:0 12px 34px rgba(19,36,32,.10);
    --shadow-soft:0 4px 18px rgba(19,36,32,.06);
    --sans:"Source Han Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",Georgia,serif;
    --mono:"Cascadia Mono","JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button,input{font-family:inherit}
  button{cursor:pointer}
  ::selection{background:#bdebe0;color:#0b3d34}

  /* ---------- header ---------- */
  .app-header{
    position:relative;
    height:78px;
    padding:0 26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    color:#ecfdf7;
    background:
      radial-gradient(900px 240px at 12% -40%, rgba(20,184,166,.38), transparent 62%),
      radial-gradient(700px 220px at 88% 150%, rgba(132,204,22,.20), transparent 60%),
      linear-gradient(100deg,#0a211c 0%,#0d3028 54%,#0b2a23 100%);
    overflow:hidden;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .app-header::before{
    content:"";
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:34px 34px;
    mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);
    pointer-events:none;
  }
  .brand{position:relative;display:flex;align-items:center;gap:16px;min-width:0}
  .seal{
    width:52px;height:52px;flex:0 0 52px;
    border-radius:15px;
    display:grid;place-items:center;
    font-family:var(--serif);
    font-size:27px;font-weight:700;color:#f4fffb;
    background:linear-gradient(145deg,#14b8a6 0%,#0f766e 58%,#3f6212 130%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.24),0 10px 24px rgba(0,0,0,.22);
    letter-spacing:-1px;
  }
  .brand-text{min-width:0}
  .eyebrow{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:.18em;
    color:#8fd9c8;
    text-transform:uppercase;
    margin-bottom:5px;
    white-space:nowrap;
  }
  .brand h1{
    margin:0;
    font-family:var(--serif);
    font-size:22px;
    line-height:1.18;
    font-weight:700;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .header-meta{
    position:relative;
    display:flex;align-items:center;gap:14px;
    font-size:11px;color:#a7d7ca;
    white-space:nowrap;
  }
  .header-meta .meta-pill{
    display:inline-flex;align-items:center;gap:7px;
    padding:7px 11px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:999px;
    background:rgba(255,255,255,.055);
  }
  .header-meta .meta-pill b{color:#ecfdf7;font-weight:600}
  .pulse{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.14)}

  /* ---------- tab bar ---------- */
  .tabbar{
    position:relative;z-index:20;
    height:58px;
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    padding:0 22px;
    background:rgba(255,255,255,.92);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(10px);
  }
  .tabs{display:flex;align-items:center;gap:6px;min-width:0;overflow:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;
    display:flex;align-items:center;gap:9px;
    height:36px;padding:0 13px;
    border:1px solid transparent;border-radius:10px;
    background:transparent;color:#47625a;
    font-size:12.5px;font-weight:600;
    transition:background .18s ease,color .18s ease,border-color .18s ease;
    white-space:nowrap;
  }
  .tab .tab-no{font-family:var(--mono);font-size:9.5px;color:#93a69f;letter-spacing:.06em}
  .tab .tab-level{
    font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;
    padding:2px 5px;border-radius:4px;color:#71877f;background:#f1f5f2;border:1px solid #e1eae5;
  }
  .tab:hover{background:#f2f7f4;color:var(--green-deep)}
  .tab.active{background:var(--green-deep);color:#f0fdf9;border-color:var(--green-deep);box-shadow:0 6px 16px rgba(11,61,52,.18)}
  .tab.active .tab-no{color:#86efac}
  .tab.active .tab-level{color:#c7f9ec;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.16)}
  .tools{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .search{
    display:flex;align-items:center;gap:8px;
    height:34px;padding:0 10px;
    border:1px solid var(--line);border-radius:9px;background:#fbfdfc;
    color:#7b8f88;
    transition:border-color .18s ease,box-shadow .18s ease,width .18s ease;
    width:224px;
  }
  .search:focus-within{border-color:#93c9bd;box-shadow:0 0 0 3px rgba(15,118,110,.09);background:#fff}
  .search svg{flex:0 0 14px;opacity:.72}
  .search input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:11.5px;color:var(--ink)}
  .search input::placeholder{color:#9aaba4}
  .search-count{font-family:var(--mono);font-size:9px;color:#82958e;white-space:nowrap}
  .tool-btn{
    height:34px;padding:0 11px;
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line);border-radius:9px;
    background:#fff;color:#415c54;
    font-size:11.5px;font-weight:600;
    transition:background .18s ease,border-color .18s ease,color .18s ease;
  }
  .tool-btn:hover{background:#f3f8f5;border-color:#bcd8d0;color:var(--green-deep)}
  .tool-btn svg{opacity:.72}
  .tool-btn.primary{background:var(--green);border-color:var(--green);color:#fff}
  .tool-btn.primary:hover{background:#0d665f;border-color:#0d665f}

  /* ---------- workspace ---------- */
  #workspace{position:relative}
  .view{display:none}
  .map-view{height:calc(100vh - 136px);min-height:560px;flex-direction:column}
  .map-view.active{display:flex}
  .scroll-view{height:calc(100vh - 136px);overflow:auto}
  .scroll-view.active{display:block}

  .view-head{
    flex:0 0 auto;
    display:flex;align-items:flex-end;justify-content:space-between;gap:30px;
    padding:16px 28px 15px;
    background:linear-gradient(180deg,#fbfdfc 0%,#f7faf8 100%);
    border-bottom:1px solid var(--line);
  }
  .head-left{min-width:0}
  .kicker{
    display:flex;align-items:center;gap:9px;
    font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:#779088;
    text-transform:uppercase;margin-bottom:7px;
  }
  .level-pill{
    display:inline-flex;align-items:center;height:19px;padding:0 7px;
    border-radius:5px;background:#e6f4ef;border:1px solid #cfe8df;
    color:var(--green);font-weight:700;font-size:9px;letter-spacing:.06em;
  }
  .view-head h2{
    margin:0 0 5px;
    font-family:var(--serif);
    font-size:21px;line-height:1.25;font-weight:700;letter-spacing:.01em;color:#132a23;
  }
  .view-head p{
    margin:0;max-width:1120px;
    font-size:11.5px;line-height:1.65;color:#60756d;
  }
  .head-stats{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding-bottom:2px}
  .stat{
    min-width:76px;padding:8px 11px;
    border:1px solid var(--line);border-radius:10px;background:#fff;
    text-align:center;
  }
  .stat b{display:block;font-family:var(--mono);font-size:17px;line-height:1;color:var(--green-deep);letter-spacing:-.02em}
  .stat span{display:block;margin-top:5px;font-size:9.5px;color:#82958e;letter-spacing:.04em}

  /* ---------- stage ---------- */
  .stage{
    position:relative;flex:1;min-height:0;overflow:hidden;
    background:
      radial-gradient(1100px 520px at 50% -15%,rgba(20,184,166,.08),transparent 64%),
      radial-gradient(900px 520px at 100% 110%,rgba(67,56,202,.045),transparent 62%),
      var(--paper);
    cursor:grab;
    touch-action:none;
  }
  .stage::before{
    content:"";
    position:absolute;inset:0;
    background-image:radial-gradient(rgba(19,36,32,.13) 1px,transparent 1px);
    background-size:22px 22px;
    opacity:.34;
    pointer-events:none;
  }
  .stage.dragging{cursor:grabbing}
  .stage svg{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;user-select:none}
  .stage svg text{user-select:none;-webkit-user-select:none}

  .legend-card{
    position:absolute;z-index:3;left:18px;bottom:16px;
    display:flex;flex-direction:column;gap:7px;
    padding:11px 13px;
    background:rgba(255,255,255,.93);
    border:1px solid rgba(210,224,218,.95);
    border-radius:12px;
    box-shadow:var(--shadow-soft);
    backdrop-filter:blur(8px);
    font-size:9.5px;color:#5b7169;
    pointer-events:none;
  }
  .legend-row{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .legend-row b{font-weight:600;color:#354f47;margin-right:2px}
  .cdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-left:7px}
  .cdot:first-child{margin-left:0}
  .cdot.high{background:#0f766e}
  .cdot.medium{background:#b45309}
  .cdot.low{background:#be123c}
  .lline{display:inline-block;width:18px;height:0;border-top:1.6px solid #0f766e;margin-left:7px}
  .lline:first-child{margin-left:0}
  .lline.dashed{border-top-style:dashed;border-color:#64748b}
  .legend-note{padding-top:6px;border-top:1px dashed #dfe8e4;color:#8a9a94;font-size:9px}

  .zoom{
    position:absolute;z-index:3;right:18px;bottom:16px;
    display:flex;align-items:center;gap:4px;
    padding:5px;
    background:rgba(255,255,255,.94);
    border:1px solid rgba(210,224,218,.95);
    border-radius:11px;
    box-shadow:var(--shadow-soft);
    backdrop-filter:blur(8px);
  }
  .zoom button{
    width:28px;height:28px;display:grid;place-items:center;
    border:0;border-radius:7px;background:transparent;color:#436159;
    font-size:15px;line-height:1;
  }
  .zoom button:hover{background:#eef6f2;color:var(--green-deep)}
  .zoom .zoom-label{
    min-width:42px;text-align:center;
    font-family:var(--mono);font-size:9.5px;color:#5c7169;
  }
  .zoom .fit{width:auto;padding:0 9px;font-size:10px;font-weight:600;letter-spacing:.02em}

  /* ---------- svg interaction ---------- */
  .node{cursor:pointer;transition:opacity .18s ease}
  .node .card{transition:filter .18s ease,stroke .18s ease}
  .node:hover .card{filter:drop-shadow(0 6px 14px rgba(19,36,32,.16))}
  .node.selected .card{stroke-width:2.2}
  .boundary.selected > rect:first-child{stroke-width:2.8}
  .boundary{cursor:pointer}
  .edge{cursor:pointer}
  .edge .edge-line{transition:stroke-width .18s ease,opacity .18s ease}
  .edge:hover .edge-line{stroke-width:2.8}
  .node.dim,.edge.dim{opacity:.16}
  .node.hl .card{filter:drop-shadow(0 8px 18px rgba(15,118,110,.20))}
  .edge.hl .edge-line{stroke-width:2.8}
  .node.search-hit .card{stroke:#f59e0b;stroke-width:2.4;filter:drop-shadow(0 0 10px rgba(245,158,11,.30))}
  .node.search-miss{opacity:.16}
  .flow-step.search-hit,.domain-card.search-hit,.algo-card.search-hit{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.13)}
  .flow-step.search-miss,.domain-card.search-miss,.algo-card.search-miss{opacity:.22}
  .node.flash .card{animation:flash 1.3s ease}
  @keyframes flash{0%,100%{filter:none}20%,60%{filter:drop-shadow(0 0 16px rgba(245,158,11,.75))}}

  /* ---------- drawer ---------- */
  .drawer{
    position:fixed;z-index:80;top:0;right:0;bottom:0;
    width:450px;max-width:100vw;
    display:flex;flex-direction:column;
    background:#fff;
    border-left:1px solid var(--line);
    box-shadow:-24px 0 60px rgba(19,36,32,.16);
    transform:translateX(105%);
    transition:transform .28s cubic-bezier(.22,.7,.3,1);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-top{
    flex:0 0 auto;
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fbfdfc,#f6faf8);
  }
  .drawer-kind{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:#7c918a;text-transform:uppercase;margin-bottom:6px}
  .drawer h2{margin:0;font-family:var(--serif);font-size:20px;line-height:1.3;font-weight:700;color:#122a22}
  .icon-btn{
    flex:0 0 30px;width:30px;height:30px;
    display:grid;place-items:center;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:#61766f;
    font-size:17px;line-height:1;
  }
  .icon-btn:hover{background:#f1f7f4;color:#203f36}
  .drawer-body{flex:1;overflow:auto;padding:18px 20px 28px}
  .badge-row{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 8px;border-radius:6px;
    border:1px solid #e0e9e5;background:#f8fbf9;
    font-size:9.5px;font-weight:600;color:#536b63;
  }
  .badge.conf-high{border-color:#c3e8df;background:#eefaf6;color:#0f766e}
  .badge.conf-medium{border-color:#f0d9bd;background:#fff8ed;color:#a14a06}
  .badge.conf-low{border-color:#f3c9d3;background:#fff5f7;color:#b01238}
  .badge.conf-unknown{border-color:#d8dedb;background:#f7f9f8;color:#5b6d67}
  .lede{margin:0 0 18px;font-size:12px;line-height:1.78;color:#415a52}
  .drawer-section{padding-top:15px;margin-top:15px;border-top:1px solid var(--line-2)}
  .drawer-section h3{
    margin:0 0 9px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:#81958e;font-family:var(--mono);font-weight:600;
  }
  .drawer-section ul{margin:0;padding-left:16px}
  .drawer-section li{font-size:11.5px;line-height:1.72;color:#435d54;margin:0 0 5px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{
    display:inline-flex;align-items:center;
    padding:4px 8px;border-radius:6px;
    background:#f2f7f4;border:1px solid #dfeae5;
    font-family:var(--mono);font-size:9.5px;color:#38594f;
  }
  .evidence{list-style:none;padding:0!important;margin:0}
  .evidence li{
    display:flex;align-items:flex-start;gap:7px;
    padding:7px 8px;margin:0 0 4px;
    background:#f8fbf9;border:1px solid #e7efeb;border-radius:7px;
    font-family:var(--mono);font-size:9px;line-height:1.5;color:#3f5b51;
    cursor:copy;word-break:break-all;
  }
  .evidence li:hover{background:#f1f8f5;border-color:#cfe5dd}
  .evidence li::before{content:"›";color:#92b0a6;flex:0 0 auto}
  .ev-path{word-break:break-all;min-width:0}
  .ev-line{flex:0 0 auto;white-space:nowrap;color:#8a9b95}
  .drawer-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .drawer-actions button{
    height:34px;padding:0 12px;border-radius:8px;
    border:1px solid var(--line);background:#fff;color:#3d5a51;
    font-size:11px;font-weight:600;
  }
  .drawer-actions button:hover{background:#f2f8f5;border-color:#bcd9d0}
  .drawer-actions button.primary{background:var(--green);border-color:var(--green);color:#fff}
  .drawer-actions button.primary:hover{background:#0d665f}
  .empty-hint{font-size:11.5px;color:#81958e;line-height:1.7;margin:0}

  /* ---------- flow view ---------- */
  .scroll-body{max-width:1720px;margin:0 auto;padding:20px 28px 54px}
  .flow-section{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:22px 24px 24px;margin-bottom:20px;
    box-shadow:var(--shadow-soft);
  }
  .flow-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
  .flow-head h3{margin:0 0 5px;font-family:var(--serif);font-size:18px;color:#132a23}
  .flow-head p{margin:0;font-size:11px;line-height:1.6;color:#70857d}
  .flow-tag{
    flex:0 0 auto;padding:5px 9px;border-radius:6px;
    border:1px solid #d6e7e1;background:#f3faf7;
    font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:#0f766e;
  }
  .flow-row{display:flex;gap:34px;align-items:stretch}
  .flow-step{
    position:relative;flex:1 1 0;min-width:0;
    display:flex;flex-direction:column;
    padding:15px 15px 13px;
    border:1px solid #dfe9e4;border-radius:14px;
    background:linear-gradient(180deg,#fff 0%,#fbfdfc 100%);
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
    cursor:pointer;
  }
  .flow-step:hover{transform:translateY(-2px);border-color:#b9d8ce;box-shadow:0 10px 24px rgba(19,36,32,.09)}
  .flow-step:not(:last-child)::after{
    content:"";position:absolute;right:-25px;top:50%;
    width:12px;height:12px;
    border-top:1.6px solid #a8c0b8;border-right:1.6px solid #a8c0b8;
    transform:translateY(-50%) rotate(45deg);
  }
  .step-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .step-no{
    width:27px;height:27px;display:grid;place-items:center;
    border-radius:8px;background:#0b3d34;color:#d1fae5;
    font-family:var(--mono);font-size:10.5px;font-weight:700;
  }
  .lane{
    padding:3px 7px;border-radius:5px;
    font-size:9px;font-weight:600;letter-spacing:.03em;
    border:1px solid transparent;white-space:nowrap;
  }
  .lane-teal{background:#e9f8f4;border-color:#c9ebe2;color:#0f766e}
  .lane-amber{background:#fff7e8;border-color:#f1dfbf;color:#a14a06}
  .lane-rose{background:#fff2f5;border-color:#f3cdd7;color:#b01238}
  .lane-green{background:#eef8ec;border-color:#d5eac9;color:#3f6212}
  .lane-indigo{background:#f0f0ff;border-color:#dcdcf7;color:#4338ca}
  .lane-slate{background:#f3f6f8;border-color:#dde5ea;color:#4b5f6c}
  .lane-blue{background:#edf6fd;border-color:#cee4f5;color:#0e7490}
  .flow-step h4{margin:0 0 7px;font-size:13.5px;line-height:1.35;color:#172f28;font-weight:650}
  .flow-step p{margin:0 0 10px;font-size:10.5px;line-height:1.68;color:#647a72;flex:1}
  .flow-step code{
    display:block;padding:6px 8px;border-radius:6px;
    background:#f4f8f6;border:1px solid #e6eeea;
    font-family:var(--mono);font-size:8.8px;line-height:1.45;color:#45635a;
    word-break:break-all;
  }
  .step-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:1px dashed #e2ebe7}
  .step-foot .conf{font-size:8.5px;font-weight:600}
  .step-foot .conf::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:4px;vertical-align:1px}
  .conf.high{color:#0f766e}.conf.high::before{background:#0f766e}
  .conf.medium{color:#a14a06}.conf.medium::before{background:#b45309}
  .conf.low{color:#b01238}.conf.low::before{background:#be123c}
  .conf.unknown{color:#5b6d67}.conf.unknown::before{background:#64748b}
  .step-foot .more{font-size:8.5px;color:#7c918a;letter-spacing:.02em}
  .flow-turn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    height:34px;color:#93a69f;font-size:8.5px;letter-spacing:.1em;
  }
  .flow-turn::before,.flow-turn::after{content:"";height:1px;width:80px;background:linear-gradient(90deg,transparent,#cfdfd8)}
  .flow-turn::after{background:linear-gradient(90deg,#cfdfd8,transparent)}
  .flow-turn span{display:flex;align-items:center;gap:5px;font-family:var(--mono)}

  .track-panel{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:20px 24px;box-shadow:var(--shadow-soft);
  }
  .track-panel h3{margin:0 0 14px;font-family:var(--serif);font-size:16px;color:#132a23}
  .track{display:grid;grid-template-columns:110px minmax(0,1fr) 260px;gap:18px;align-items:center;padding:11px 0;border-top:1px dashed #e2ebe7}
  .track:first-of-type{border-top:0;padding-top:0}
  .track-name{font-size:10px;font-weight:700;color:#3d5a51;letter-spacing:.04em}
  .track-states{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .state{
    padding:4px 8px;border-radius:5px;
    background:#f4f8f6;border:1px solid #e0eae5;
    font-family:var(--mono);font-size:8.8px;color:#3d5a51;letter-spacing:.02em;
  }
  .state.terminal{background:#eef8f4;border-color:#c7e8df;color:#0f766e}
  .track-arrow{color:#a3b7b0;font-size:10px}
  .track-note{font-size:9.5px;line-height:1.55;color:#81958e}

  /* ---------- data view ---------- */
  .domain-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .domain-card{
    display:flex;flex-direction:column;
    background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:18px 18px 14px;
    box-shadow:var(--shadow-soft);
    transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
    cursor:pointer;
  }
  .domain-card:hover{border-color:#b9d8ce;box-shadow:0 10px 26px rgba(19,36,32,.09);transform:translateY(-2px)}
  .domain-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
  .domain-head h3{margin:0;font-family:var(--serif);font-size:16px;color:#132a23}
  .domain-head .count{display:block;margin-top:4px;font-family:var(--mono);font-size:8.5px;color:#8a9b95;letter-spacing:.06em}
  .tone-dot{width:10px;height:10px;border-radius:3px;flex:0 0 10px;margin-top:4px}
  .tone-green .tone-dot{background:#0f766e}.tone-teal .tone-dot{background:#0e7490}
  .tone-blue .tone-dot{background:#2563eb}.tone-amber .tone-dot{background:#b45309}
  .tone-rose .tone-dot{background:#be123c}.tone-indigo .tone-dot{background:#4338ca}
  .table-list{list-style:none;margin:0 0 12px;padding:0;flex:1}
  .table-list li{display:grid;grid-template-columns:128px minmax(0,1fr);gap:9px;padding:6px 0;border-top:1px dashed #e7eeea;align-items:baseline}
  .table-list li:first-child{border-top:0}
  .table-list code{font-family:var(--mono);font-size:8.8px;color:#294f45;background:#f3f8f5;border:1px solid #e3ede8;padding:2px 4px;border-radius:4px;word-break:break-all;justify-self:start}
  .table-list span{font-size:9.5px;line-height:1.5;color:#6d817a}
  .domain-key{padding:9px 10px;border-radius:8px;background:#f7faf8;border:1px solid #e6eeea;font-size:9.5px;line-height:1.55;color:#4d675e}
  .domain-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:8.5px;color:#8a9b95}
  .algo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
  .algo-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-soft);cursor:pointer;transition:border-color .18s ease,box-shadow .18s ease}
  .algo-card:hover{border-color:#b9d8ce;box-shadow:0 10px 26px rgba(19,36,32,.09)}
  .algo-card h3{margin:0 0 10px;font-family:var(--serif);font-size:15px;color:#132a23;display:flex;align-items:center;gap:8px}
  .algo-card h3::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--green);flex:0 0 7px}
  .algo-card ul{margin:0;padding-left:16px}
  .algo-card li{font-size:10.5px;line-height:1.7;color:#5c736a;margin-bottom:4px}
  .algo-card code{font-family:var(--mono);font-size:9px;background:#f3f8f5;padding:1px 4px;border-radius:3px;color:#2d584c}
  .section-title{display:flex;align-items:baseline;gap:10px;margin:22px 0 12px}
  .section-title h2{margin:0;font-family:var(--serif);font-size:18px;color:#132a23}
  .section-title span{font-size:10px;color:#8a9b95}

  /* ---------- modal ---------- */
  .modal{
    position:fixed;z-index:100;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:26px;
    background:rgba(9,26,22,.52);
    backdrop-filter:blur(4px);
    opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease;
  }
  .modal.open{opacity:1;visibility:visible}
  .modal-card{
    width:min(860px,100%);max-height:86vh;display:flex;flex-direction:column;
    background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.28);
    overflow:hidden;
    transform:translateY(10px);transition:transform .22s ease;
  }
  .modal.open .modal-card{transform:translateY(0)}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 22px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fbfdfc,#f6faf8)}
  .modal-head h2{margin:0 0 4px;font-family:var(--serif);font-size:21px;color:#132a23}
  .modal-head p{margin:0;font-size:10.5px;color:#7b8f88}
  .modal-body{overflow:auto;padding:20px 22px 26px}
  .modal-body h3{margin:20px 0 8px;font-size:10px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#81958e}
  .modal-body h3:first-child{margin-top:0}
  .modal-body p,.modal-body li{font-size:11.5px;line-height:1.75;color:#435d54}
  .modal-body ul{margin:0;padding-left:17px}
  .modal-body code{font-family:var(--mono);font-size:9.5px;background:#f2f7f4;border:1px solid #e3ede8;padding:1px 4px;border-radius:3px;color:#2d584c}
  .note-item{padding:11px 13px;border:1px solid #e4ece8;border-radius:10px;background:#f9fbfa;margin-bottom:8px}
  .note-item .note-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
  .note-item b{font-size:11.5px;color:#27463c}
  .note-item p{margin:0;font-size:10.5px;line-height:1.7;color:#657b73}
  .note-item .badge{font-size:8.5px;padding:3px 6px}
  .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;z-index:120;left:50%;bottom:26px;
    transform:translate(-50%,20px);
    padding:10px 15px;border-radius:9px;
    background:rgba(11,61,52,.94);color:#e9fdf7;
    font-size:11px;letter-spacing:.02em;
    box-shadow:0 12px 30px rgba(0,0,0,.2);
    opacity:0;visibility:hidden;transition:all .22s ease;
    pointer-events:none;
  }
  .toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

  .mobile-hint{display:none;position:absolute;z-index:3;left:12px;top:12px;padding:6px 9px;border-radius:7px;background:rgba(255,255,255,.92);border:1px solid #d6e4de;font-size:9px;color:#5f736c;box-shadow:var(--shadow-soft);pointer-events:none}

  /* ---------- responsive ---------- */
  @media (max-width:1240px){
    .header-meta{display:none}
    .search{width:180px}
    .domain-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .flow-row{flex-wrap:wrap}
    .flow-step{flex:1 1 calc(50% - 34px)}
    .flow-step::after{display:none}
    .track{grid-template-columns:90px minmax(0,1fr)}
    .track-note{grid-column:1/-1;padding-left:108px}
  }
  @media (max-width:900px){
    .app-header{height:auto;min-height:72px;padding:12px 16px}
    .brand h1{font-size:18px;white-space:normal}
    .seal{width:44px;height:44px;flex-basis:44px;font-size:23px}
    .eyebrow{font-size:8px}
    .tabbar{height:auto;padding:9px 12px;gap:10px;flex-wrap:wrap}
    .tabs{order:2;width:100%}
    .tools{order:1;width:100%;justify-content:flex-end}
    .search{flex:1;width:auto}
    .map-view,.scroll-view{height:auto}
    .map-view{min-height:0}
    .stage{height:66vh;min-height:440px}
    .view-head{padding:14px 16px}
    .view-head h2{font-size:18px}
    .view-head p{font-size:10.5px}
    .head-stats{display:none}
    .scroll-body{padding:14px 14px 40px}
    .flow-row{display:block}
    .flow-step{margin-bottom:12px}
    .flow-step::after{display:none}
    .flow-turn{height:22px}
    .domain-grid,.algo-grid{grid-template-columns:1fr}
    .track{grid-template-columns:1fr;gap:7px}
    .track-note{padding-left:0}
    .drawer{width:100%;top:auto;height:82vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%)}
    .drawer.open{transform:translateY(0)}
    .legend-card{display:none}
    .zoom{right:12px;bottom:12px}
    .mobile-hint{display:block}
    .modal{padding:10px}
    .grid-2{grid-template-columns:1fr}
  }

  /* ---------- print ---------- */
  @page{size:A3 landscape;margin:9mm}
  @media print{
    body{background:#fff}
    .app-header,.tabbar,.drawer,.modal,.toast,.legend-card,.zoom{display:none!important}
    .view{display:none!important}
    .view.active{display:block!important}
    .map-view,.scroll-view{height:auto!important;overflow:visible!important}
    .view-head{padding:0 0 6mm;border:0;background:#fff}
    .view-head h2{font-size:16pt}
    .view-head p{font-size:8pt;color:#444}
    .head-stats{display:none}
    .stage{height:auto!important;min-height:0!important;background:#fff;overflow:visible}
    .stage::before{display:none}
    .stage svg{position:static;width:100%;height:auto}
    .scroll-body{padding:0}
    .flow-section,.track-panel,.domain-card,.algo-card{box-shadow:none;break-inside:avoid}
    .flow-section{page-break-inside:avoid}
    .flow-step{cursor:default}
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <div class="seal">净</div>
    <div class="brand-text">
      <div class="eyebrow">CURRENT-STATE ARCHITECTURE · <span id="meta-date">2026-10-22</span></div>
      <h1>净源智研 · 系统总体架构</h1>
    </div>
  </div>
  <div class="header-meta">
    <span class="meta-pill"><span class="pulse"></span>当前状态 · 单机原型</span>
    <span class="meta-pill"><b>L1 + L2</b> 架构视图</span>
    <span class="meta-pill"><b id="evidence-count">—</b> 个证据引用</span>
  </div>
</header>

<div class="tabbar">
  <div class="tabs" id="tabs" role="tablist" aria-label="架构视图"></div>
  <div class="tools">
    <label class="search" title="搜索节点、模块、表名或流程步骤">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="search" type="search" placeholder="搜索节点 / 模块 / 表名" autocomplete="off">
      <span class="search-count" id="search-count"></span>
    </label>
    <button class="tool-btn" data-action="help" title="读图说明与已知边界">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-5M12 8h.01"></path></svg>
      说明
    </button>
    <button class="tool-btn" data-action="export" title="导出当前架构视图为 SVG">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"></path><path d="M4 21h16"></path></svg>
      导出 SVG
    </button>
    <button class="tool-btn primary" data-action="print" title="打印当前视图">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="7" rx="1"></rect></svg>
      打印
    </button>
  </div>
</div>

<main id="workspace"></main>

<aside class="drawer" id="drawer" aria-hidden="true" aria-label="节点详情">
  <div class="drawer-top">
    <div>
      <div class="drawer-kind" id="drawer-kind">NODE</div>
      <h2 id="drawer-title">选择节点</h2>
    </div>
    <button class="icon-btn" data-close-drawer aria-label="关闭详情">×</button>
  </div>
  <div class="drawer-body" id="drawer-body">
    <p class="empty-hint">点击任意节点、连线或流程步骤，查看职责、技术协议、数据口径与证据来源。</p>
  </div>
</aside>

<div class="modal" id="help-modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="modal-head">
      <div>
        <h2 id="help-title">读图说明与已知边界</h2>
        <p>当前状态架构 · 证据优先 · 模拟与推断显式标记</p>
      </div>
      <button class="icon-btn" data-close-help aria-label="关闭说明">×</button>
    </div>
    <div class="modal-body" id="help-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MODEL = __MODEL_JSON__;
</script>
</body>
</html>
